# brain/catalog/gpus.yaml — FACTS tier: the hardware the brain can deploy on.
#
# Peak numbers are approximate public datasheet values, DENSE (no 2:4 sparsity),
# in TFLOPS (TOPS for int8). They feed a roofline model, so only their RATIOS
# matter much; real-vs-sim error is absorbed later by calibration from real runs.
#
# price_per_hour is an approximate on-demand marketplace price in USD (Oct 2026).
# Prices drift weekly — edit them; the brain never hardcodes a price elsewhere.
#
# Fields:
#   memory_gb       usable HBM/GDDR per GPU
#   mem_bw_gbps     memory bandwidth, GB/s
#   bf16_tflops     dense bf16 (fp16 on GPUs without bf16)
#   fp8_tflops      null = no fp8 tensor cores
#   int8_tops       dense int8
#   fp4_tflops      null = no fp4 tensor cores
#   link_gbps       effective per-GPU all-reduce bandwidth for tensor parallel
#                   (NVLink / Infinity Fabric when present, else PCIe)
#   max_tp          largest tensor-parallel group on one node

